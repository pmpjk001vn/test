<!-- =====================================================================
  Mascot.html - 12 linh vật con giáp Việt Nam (SVG tự vẽ, không cần file ảnh)
  Chỉ điện thoại | chỉ Sale được chỉ định trong MASCOT_CONFIG

  BẢN CẬP NHẬT:
   1) Nhấp giữ linh vật rồi kéo ĐI ĐÂU CŨNG ĐƯỢC (kể cả ra khỏi thanh panel).
      - Thả ngoài panel: nó đứng ở chỗ đó và đi qua đi lại quanh đó.
      - Thả lại trên thanh panel: nó vào lại panel và đi qua đi lại ở đó.
   2) Bấm "XÁC NHẬN LƯU ĐƠN" xong, linh vật nhảy ra màn hình, chạy NGẪU NHIÊN
      2 vòng rồi chạy về chỗ cũ, có bong bóng thoại ngay miệng.
      (Tự bắt nút #btnSubmitOrder. Cũng có thể gọi thủ công: mascotCelebrate('Đã Lên Đơn Rồi'))
   3) CHỈ ID được chỉ định trong MASCOT_CONFIG mới có linh vật và dùng được
      các chức năng (kéo thả, ăn mừng, demo). ID khác: không có gì hết.
   4) Nút 🐾 ngay bên phải tên người dùng trên thanh panel: bấm -> popup 12 con giáp + dê béo -> chọn để đổi linh vật.
      Chỉ ID có linh vật mới thấy nút 🐾. Lựa chọn được nhớ theo ID trên thiết bị (localStorage).
      Nếu nút 🐾 không nằm đúng chỗ: điền MASCOT_NAME_SELECTOR (selector của phần tử chứa tên).

  12 con:  chuot (Tý) · trau (Sửu) · cop (Dần) · meo (Mão) · rong (Thìn) · ran (Tỵ)
           ngua (Ngọ) · de (Mùi) · khi (Thân) · ga (Dậu) · cho (Tuất) · heo (Hợi)
  Thêm: de2 (dê béo)

  LƯU Ý TÍCH HỢP:
   - Gọi initMascot() sau khi đăng nhập.
   - Gọi removeMascot() khi đăng xuất (con vật nằm ngoài thanh nav nên cần gỡ thủ công).
  Xem thử tất cả (chỉ tài khoản có linh vật): Console gõ  mascotDemo()
  Thử hiệu ứng lên đơn: Console gõ  mascotCelebrate()
===================================================================== -->
<style>
  /* Lane chỉ là chỗ giữ vị trí trên thanh panel, không chứa con vật nữa */
  #mascotLane{
    position:absolute; left:0; right:0; bottom:0; height:44px;
    overflow:hidden; pointer-events:none; z-index:1;
  }
  /* Con vật nằm ở lớp fixed của trang => kéo ra khỏi panel được */
  #mascotRunner{
    position:fixed; left:0; top:0; width:var(--m-size,44px); height:var(--m-size,44px);
    z-index:99990; will-change:transform;
    pointer-events:auto;            /* riêng con vật thì bấm/kéo được */
    touch-action:none;              /* kéo trên điện thoại không bị cuộn trang */
    cursor:grab;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  #mascotRunner.m-drag{ cursor:grabbing; }

  /* Con vật chạy lúc ăn mừng (nằm trên cùng màn hình, không chặn thao tác) */
  #mascotRoamer{
    position:fixed; left:0; top:0; width:var(--m-size,44px); height:var(--m-size,44px);
    z-index:100000; pointer-events:none; will-change:transform;
  }
  #mascotRoamer .mBody .m-a, #mascotRoamer .mBody .m-b{ animation-duration:.24s; }   /* chân chạy nhanh hơn */

  /* Bong bóng thoại */
  #mascotBubble{
    position:fixed; left:0; top:0; z-index:100001; pointer-events:none;
    background:#fff; color:#1a56db; border:1.5px solid #1a56db; border-radius:12px;
    padding:6px 11px; font:700 12px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    white-space:nowrap; box-shadow:0 3px 10px rgba(0,0,0,.25);
    opacity:0; transition:opacity .25s; will-change:transform;
  }
  #mascotBubble.show{ opacity:1; }
  #mascotBubble::after{                       /* mũi nhọn chỉ xuống miệng con vật */
    content:''; position:absolute; bottom:-6.5px; left:calc(var(--tail,16px) - 5px);
    width:10px; height:10px; background:#fff;
    border-right:1.5px solid #1a56db; border-bottom:1.5px solid #1a56db;
    transform:rotate(45deg);
  }

  .mBody{
    width:100%; height:100%;
    animation:mascotBob .42s ease-in-out infinite;
    filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.35));
    transform-origin:bottom center;
  }
  .mBody svg{ width:100%; height:100%; display:block; overflow:visible; }

  /* Đang bị nhấc lên: phóng to nhẹ, chân đạp loạn */
  .m-drag .mBody{ animation:none; transform:translateY(-5px) scale(1.12) rotate(-5deg); }
  .m-drag .mBody .m-a, .m-drag .mBody .m-b{ animation-duration:.14s; }

  @keyframes mascotBob{
    0%,100%{ transform:translateY(0)    rotate(-2deg); }
    50%    { transform:translateY(-3px) rotate(2deg);  }
  }

  /* Chân chạy chéo nhau, đuôi vẫy, tai giật, mắt chớp */
  .mBody .m-a, .mBody .m-b{ transform-box:fill-box; transform-origin:50% 10%; }
  .mBody .m-a{ animation:mLeg .42s ease-in-out infinite alternate; }
  .mBody .m-b{ animation:mLeg .42s ease-in-out infinite alternate-reverse; }
  @keyframes mLeg{ from{ transform:rotate(-28deg); } to{ transform:rotate(28deg); } }

  .mBody .m-tail{ transform-box:fill-box; transform-origin:100% 100%; animation:mWag .5s ease-in-out infinite alternate; }
  .mBody .m-tail.fast{ animation-duration:.2s; }
  .mBody .m-tail.hang{ transform-origin:100% 0%; }          /* đuôi buông xuống (trâu, ngựa) */
  @keyframes mWag{ from{ transform:rotate(-12deg); } to{ transform:rotate(14deg); } }

  .mBody .m-ear{ transform-box:fill-box; transform-origin:50% 100%; animation:mEar 3s ease-in-out infinite; }
  @keyframes mEar{ 0%,84%,100%{ transform:rotate(0); } 89%{ transform:rotate(-9deg); } 94%{ transform:rotate(3deg); } }

  .mBody .m-eye{ transform-box:fill-box; transform-origin:50% 50%; animation:mBlink 3.6s infinite; }
  @keyframes mBlink{ 0%,92%,100%{ transform:scaleY(1); } 96%{ transform:scaleY(.1); } }

  /* Rắn: thân lượn sóng, đầu lắc, lưỡi thè */
  .mBody .m-seg{ animation:mSeg .45s ease-in-out infinite alternate; }
  @keyframes mSeg{ from{ transform:translateY(-3px); } to{ transform:translateY(3px); } }
  .mBody .m-head{ transform-box:fill-box; transform-origin:30% 70%; animation:mHead .45s ease-in-out infinite alternate; }
  @keyframes mHead{ from{ transform:rotate(-4deg); } to{ transform:rotate(4deg); } }
  .mBody .m-tongue{ transform-box:fill-box; transform-origin:0% 50%; animation:mTongue 1.3s infinite; }
  @keyframes mTongue{ 0%,60%,100%{ transform:scaleX(.1); } 70%,90%{ transform:scaleX(1); } }

  /* Gà: vỗ cánh khi chạy */
  .mBody .m-wing{ transform-box:fill-box; transform-origin:60% 10%; animation:mWing .3s ease-in-out infinite alternate; }
  @keyframes mWing{ from{ transform:rotate(-8deg); } to{ transform:rotate(10deg); } }

  /* Rồng châu Á: thân lượn sóng, đầu nhấp nhô theo, râu vẫy */
  .mBody .m-dseg{ animation:mDSeg .62s ease-in-out infinite alternate; }
  @keyframes mDSeg{ from{ transform:translateY(-4px); } to{ transform:translateY(4px); } }
  .mBody .m-whisk{ transform-box:fill-box; transform-origin:0% 50%; animation:mWhisk .55s ease-in-out infinite alternate; }
  @keyframes mWhisk{ from{ transform:rotate(-9deg); } to{ transform:rotate(11deg); } }

  /* ===== Nút 🐾 đổi linh vật: nằm ở lớp fixed, bám ngay sau tên người dùng ===== */
  #mascotPaw{
    position:fixed; left:0; top:0; z-index:99995; display:none; will-change:transform;
    width:28px; height:28px; padding:0; border:0; border-radius:50%;
    background:rgba(255,255,255,.2); color:#fff; font-size:15px; line-height:28px; text-align:center;
    cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation;
  }
  #mascotPaw:active{ background:rgba(255,255,255,.4); }

  /* ===== Popup chọn linh vật ===== */
  #mascotPickBack{
    position:fixed; inset:0; z-index:100020; background:rgba(15,23,42,.45);
    display:flex; justify-content:center; align-items:flex-start; padding:72px 12px 12px;
    opacity:0; transition:opacity .18s;
  }
  #mascotPickBack.show{ opacity:1; }
  #mascotPicker{
    width:min(100%,360px); background:#fff; border-radius:18px; padding:14px 12px 12px;
    box-shadow:0 14px 34px rgba(0,0,0,.32);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    transform:translateY(-10px) scale(.97); transition:transform .18s;
  }
  #mascotPickBack.show #mascotPicker{ transform:none; }
  .mpHead{ display:flex; align-items:center; justify-content:space-between; padding:0 4px 10px; color:#1a56db; font-weight:700; font-size:15px; }
  .mpX{ width:30px; height:30px; border:0; border-radius:50%; background:#eef2ff; color:#1a56db; font-size:14px; font-weight:700; cursor:pointer; }
  .mpGrid{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
  .mpItem{
    border:2px solid transparent; background:#f4f6fb; border-radius:14px; padding:6px 2px 5px;
    text-align:center; cursor:pointer; font:600 12px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#1f2937;
    -webkit-tap-highlight-color:transparent;
  }
  .mpItem .mBody{ width:54px; height:54px; margin:0 auto 3px; }
  .mpItem small{ display:block; font-weight:500; font-size:10.5px; color:#6b7280; }
  .mpItem.on{ border-color:#1a56db; background:#e8efff; }
  .mpItem:active{ transform:scale(.95); }
  .mpItem:last-child:nth-child(4n+1){ grid-column:2 / span 2; }   /* ô lẻ cuối nằm giữa */
  @media (prefers-reduced-motion:reduce){ .mpItem .mBody, .mpItem .mBody *{ animation:none !important; } }
</style>

<script>
// =====================================================================
// CẤU HÌNH: ID nhân viên (viết thường) -> con giáp riêng
//   animal: chuot | trau | cop | meo | rong | ran | ngua | de | de2 | khi | ga | cho | heo
//           (gõ tiếng Anh cũng được: mouse, buffalo, tiger, cat, dragon, snake,
//            horse, goat, monkey, rooster, dog, pig)
//   size  : kích thước (px)
//   speed : số giây cho 1 vòng đi + về trên thanh panel (càng lớn càng chậm)
// Chỉ ID có trong danh sách này MỚI có linh vật.
// =====================================================================
const MASCOT_CONFIG = {
  '':   { animal: 'chuot', size: 44, speed: 14 },
  'sale02':   { animal: 'trau',  size: 46, speed: 22 },
  'sale03':   { animal: 'cop',   size: 44, speed: 13 },
  'phongkho':   { animal: 'meo',   size: 47, speed: 24 },
  'tester':   { animal: 'rong',  size: 46, speed: 16 },
  'sale06':   { animal: 'ran',   size: 44, speed: 20 },
  'sale07':   { animal: 'ngua',  size: 46, speed: 11 },
  'salenghi': { animal: 'de2',   size: 50, speed: 26 },
  'sale09':   { animal: 'khi',   size: 44, speed: 12 },
  '':   { animal: 'ga',    size: 44, speed: 15 },
  'sale11':   { animal: 'cho',   size: 44, speed: 16 },
  'sale12':   { animal: 'heo',   size: 44, speed: 19 },
  'thuysale': { animal: 'de2',   size: 48, speed: 23 }   // dê béo, to hơn và chạy chậm hơn
};

// Đổi thành true nếu muốn MỌI tài khoản Sale đều có linh vật:
// ID không nằm trong danh sách trên sẽ được gán 1 con cố định theo ID.
const MASCOT_AUTO_ALL_SALE = false;

// ---- Thông số chạy ăn mừng khi lên đơn ----
const MASCOT_ROAM_TEXT   = 'Đã Lên Đơn Rồi';  // nội dung bong bóng thoại
const MASCOT_ROAM_SPEED  = 260;               // px/giây (vừa phải; tăng = chạy nhanh hơn)
const MASCOT_ROAM_LAPS   = 2;                 // số vòng
const MASCOT_ROAM_POINTS = 4;                 // số điểm ngẫu nhiên mỗi vòng
const MASCOT_BUBBLE_STAY = 2600;              // ms bong bóng còn hiện sau khi về chỗ
const MASCOT_ACTIONS = ['run', 'zigzag', 'jump', 'spin', 'dance'];
let _mLastAct = '';

// ---- Đi qua đi lại sau khi kéo thả ----
// Bán kính đi lại quanh chỗ vừa thả (px). Đặt 0 = đi hết cả chiều rộng.
const MASCOT_PATROL_RADIUS = 0;

const MASCOT_NAMES = {
  chuot:'Chuột (Tý)', trau:'Trâu (Sửu)', cop:'Cọp (Dần)', meo:'Mèo (Mão)',
  rong:'Rồng (Thìn)', ran:'Rắn (Tỵ)', ngua:'Ngựa (Ngọ)', de:'Dê (Mùi)', de2:'Dê béo (Mùi)',
  khi:'Khỉ (Thân)', ga:'Gà (Dậu)', cho:'Chó (Tuất)', heo:'Heo (Hợi)'
};
const MASCOT_ALIAS = {
  mouse:'chuot', rat:'chuot', buffalo:'trau', ox:'trau', tiger:'cop', ho:'cop',
  cat:'meo', dragon:'rong', snake:'ran', horse:'ngua', goat:'de',
  monkey:'khi', rooster:'ga', chicken:'ga', dog:'cho', pig:'heo', lon:'heo'
};

// ---------------------------------------------------------------------
// HÌNH VẼ (quay mặt sang phải, khung 64x64)
// ---------------------------------------------------------------------
function _mLeg(cls, x, fill, paw, h){
  h = h || 16;
  return '<g class="' + cls + '"><rect x="' + x + '" y="42" width="6.5" height="' + h + '" rx="3.2" fill="' + fill + '"/>' +
         (paw ? '<ellipse cx="' + (x + 3.25) + '" cy="' + (41.5 + h) + '" rx="4.2" ry="2.5" fill="' + paw + '"/>' : '') + '</g>';
}

// Khung chung cho thú 4 chân. Tuỳ chọn: hx,hy,hr (đầu), ex,ey (mắt), legH (độ dài chân)
// Con nào có sẵn "svg" thì dùng luôn (rắn, gà).
function _mAnimalSVG(o){
  if(o.svg) return o.svg;
  const legFar = o.legFar || o.dark, h = o.legH || 16;
  const hx = o.hx || 48, hy = o.hy || 27, hr = o.hr || 11, ex = o.ex || 51.5, ey = o.ey || 25;
  return '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
    _mLeg('m-a', 42, legFar, o.paw, h) + _mLeg('m-b', 22, legFar, o.paw, h) +      // 2 chân xa
    (o.tail || '') +
    '<ellipse cx="30" cy="38" rx="17" ry="11.5" fill="' + o.body + '"/>' +          // thân
    (o.belly ? '<ellipse cx="30" cy="44" rx="11" ry="4.5" fill="' + o.belly + '"/>' : '') +
    (o.mark || '') +
    _mLeg('m-a', 15, o.leg, o.paw, h) + _mLeg('m-b', 35, o.leg, o.paw, h) +         // 2 chân gần
    (o.earB || '') +
    '<circle cx="' + hx + '" cy="' + hy + '" r="' + hr + '" fill="' + (o.head || o.body) + '"/>' +   // đầu
    (o.face || '') +
    '<g class="m-eye"><circle cx="' + ex + '" cy="' + ey + '" r="2.3" fill="' + (o.eye || '#222') + '"/>' +
    '<circle cx="' + (ex + .8) + '" cy="' + (ey - .8) + '" r=".8" fill="' + (o.hi || '#fff') + '"/></g>' +
    (o.earF || '') +
    '</svg>';
}

// 🐍 Rắn xanh: thân thon dài uốn lượn, ngóc đầu, đầu to rõ, sọc bụng sáng + đốm lưng, thè lưỡi chẻ
function _mSnakeSVG(){
  const N = 20, pts = [];
  const sm = function(u){ u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); };
  const cl = function(u){ return { x: 4 + u * 41, y: 52 + 3 * Math.sin(u * Math.PI * 3.6) - 15 * sm((u - .6) / .4) }; };
  // lấy mẫu dày rồi chia đều theo chiều dài đường cong => các đốt cách đều nhau, đoạn cổ dốc không bị thưa
  const dense = [], cum = [0];
  for(let k = 0; k <= 300; k++){
    const p = cl(k / 300); dense.push(p);
    if(k) cum.push(cum[k - 1] + Math.hypot(p.x - dense[k - 1].x, p.y - dense[k - 1].y));
  }
  for(let i = 0, k = 0; i < N; i++){
    const t = i / (N - 1), want = t * cum[300];
    while(k < 300 && cum[k] < want) k++;
    const p = dense[k];
    const r = t < .55 ? 1.5 + 2.5 * Math.sin(t / .55 * Math.PI / 2) : 4 - .6 * ((t - .55) / .45);
    pts.push({ x: p.x, y: p.y, r: r, d: (-i * .045).toFixed(2) + 's' });
  }
  const neck = pts[N - 1], hd = neck.d;
  const G = function(d, inner){ return '<g class="m-seg" style="animation-delay:' + d + '">' + inner + '</g>'; };
  const f = function(v){ return v.toFixed(1); };
  let s = '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">';
  // lớp 1: viền tối (vẽ trước để không có đường cung cắt ngang thân)
  pts.forEach(function(p){ s += G(p.d, '<circle cx="' + f(p.x) + '" cy="' + f(p.y) + '" r="' + (p.r + .8).toFixed(2) + '" fill="#4E9A33"/>'); });
  s += G(hd, '<ellipse cx="51.5" cy="31" rx="9.4" ry="7.2" fill="#4E9A33"/>');
  // lớp 2: nền bụng sáng (cả đốt) -> lớp 3: lưng xanh nhích lên trên => chừa dải bụng sáng liền mạch bên dưới
  pts.forEach(function(p){ s += G(p.d, '<circle cx="' + f(p.x) + '" cy="' + f(p.y) + '" r="' + p.r.toFixed(2) + '" fill="#DDF59E"/>'); });
  s += G(hd, '<ellipse cx="51.5" cy="31" rx="8.6" ry="6.4" fill="#7ACD52"/>');
  pts.forEach(function(p, i){
    const full = i < 3;   // ngọn đuôi tô xanh trọn đốt
    s += G(p.d, '<circle cx="' + f(p.x) + '" cy="' + f(p.y - (full ? 0 : p.r * .22)) + '" r="' + (p.r * (full ? 1 : .76)).toFixed(2) + '" fill="#6DBE45"/>');
  });
  // lớp 4: đốm lưng sẫm (cứ 3 đốt một đốm)
  pts.forEach(function(p, i){
    if(i % 3 === 1 && i > 1){
      s += G(p.d, '<ellipse cx="' + f(p.x) + '" cy="' + f(p.y - p.r * .45) + '" rx="' + (p.r * .5).toFixed(2) + '" ry="' + (p.r * .3).toFixed(2) + '" fill="#3E8E3A"/>');
    }
  });
  s += G(hd,
    '<path d="M47.5 25.6 l2.4 -2 l2.4 2 l-2.4 2z" fill="#3E8E3A"/>' +
    '<ellipse cx="55" cy="34" rx="5.4" ry="2.6" fill="#DDF59E"/>' +
    '<circle cx="53" cy="33.2" r="2" fill="#FF8FA3" opacity=".45"/>' +
    '<circle cx="59.6" cy="30.2" r=".6" fill="#3E6E2A"/>' +
    '<path d="M52.5 35.2 q3.6 2 7.8 -.4" stroke="#3E6E2A" stroke-width=".9" fill="none" stroke-linecap="round"/>' +
    '<g class="m-eye"><circle cx="54.2" cy="28" r="2.5" fill="#222"/><circle cx="55" cy="27.1" r=".9" fill="#fff"/></g>' +
    '<path class="m-tongue" d="M60.3 35 L64.8 35 M64.8 35 L67 33.6 M64.8 35 L67 36.4" stroke="#E63946" stroke-width="1.1" fill="none" stroke-linecap="round"/>');
  return s + '</svg>';
}

// 🐉 Rồng châu Á: KHÔNG chân, thân dài uốn lượn bay trên trời, bờm + gai lưng đỏ, sừng, râu vẫy
function _mDragonSVG(){
  const N = 13;                                   // số đốt thân (0 = đuôi ... 12 = cổ)
  let s = '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">';
  for(let i = 0; i < N; i++){
    const x = 6 + i * 3.4, y = 47 - i * .95 + 5 * Math.sin(i * .5), r = 1.6 + i * 0.3;   // thân uốn chữ S
    s += '<g class="m-dseg" style="animation-delay:' + (-i * .08).toFixed(2) + 's">';
    if(i === 0){                                  // ngọn đuôi: 2 túm lửa đỏ
      s += '<path d="M' + (x + 1) + ' ' + y + ' C' + (x - 3) + ' ' + (y - 2) + ' ' + (x - 6) + ' ' + (y - 8) + ' ' + (x - 3.5) + ' ' + (y - 12) +
           ' C' + (x - 1) + ' ' + (y - 9) + ' ' + (x + 2) + ' ' + (y - 8) + ' ' + (x + 2) + ' ' + (y - 4) + 'Z" fill="#E5452F"/>' +
           '<path d="M' + (x + 1) + ' ' + (y + 1) + ' C' + (x - 4) + ' ' + (y + 2) + ' ' + (x - 6) + ' ' + (y + 7) + ' ' + (x - 3) + ' ' + (y + 9.5) +

function _mNorm(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').trim();
}
function _mKey(a){
  const k = _mNorm(a);
  return MASCOT_ART[k] ? k : (MASCOT_ALIAS[k] || 'meo');
}

function _mascotIsMobile(){
  return window.matchMedia('(max-width: 768px)').matches ||
         /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
}

// Chỉ ID nằm trong MASCOT_CONFIG (hoặc bật AUTO_ALL_SALE) mới nhận được cấu hình.
// Dùng hasOwnProperty để các ID như "constructor", "toString" không lọt qua.
function _mascotPick(id){
  if(Object.prototype.hasOwnProperty.call(MASCOT_CONFIG, id)) return MASCOT_CONFIG[id];
  if(!MASCOT_AUTO_ALL_SALE) return null;
  let h = 0;
  for(let i = 0; i < id.length; i++) h = (h * 31 + id.charCodeAt(i)) >>> 0;
  const names = Object.keys(MASCOT_ART);
  return { animal: names[h % names.length] };
}

// ---------------------------------------------------------------------
// TRẠNG THÁI + VÒNG LẶP CHUYỂN ĐỘNG (requestAnimationFrame)
// ---------------------------------------------------------------------
const _M = {
  raf: 0, last: 0,
  lane: null, run: null, art: null, cfg: null, size: 44,
  x: 0, dir: 1, walk: 30,          // vị trí (trong panel) / hướng / tốc độ đi bộ
  center: null,                    // tâm đi lại trong panel sau khi kéo thả (null = cả thanh)
  free: null,                      // null = đang ở panel; {x,y,c} = đang đứng tự do ngoài panel
  drag: null,                      // trạng thái đang kéo
  roam: null, roamer: null, rdir: 1, busy: false,   // trạng thái chạy ăn mừng
  obs: null, obsT: 0,              // theo dõi nút lưu đơn
  bubble: null, hideT: 0, fadeT: 0,
  paw: null, pickBack: null, nameEl: null, rg: null, pawT: '', pawOn: false, pawTry: 0,   // nút 🐾 + popup
  animal: '', uid: ''              // con vật đang dùng / ID đang đăng nhập
};

function _mRand(a, b){ return a + Math.random() * (b - a); }

function _mRange(){
  return _M.lane ? Math.max(0, _M.lane.clientWidth - _M.size) : 0;
}

// Giới hạn đi lại khi đang ở trong panel
function _mBounds(){
  const range = _mRange();
  if(_M.center == null || !MASCOT_PATROL_RADIUS) return { min: 0, max: range };
  return {
    min: Math.max(0, _M.center - MASCOT_PATROL_RADIUS),
    max: Math.min(range, _M.center + MASCOT_PATROL_RADIUS)
  };
}

// Giới hạn đi lại khi đang đứng tự do ngoài panel (đi ngang quanh chỗ thả)
function _mFreeBounds(){
  const maxX = Math.max(0, window.innerWidth - _M.size);
  const R = MASCOT_PATROL_RADIUS || maxX;
  return { min: Math.max(0, _M.free.c - R), max: Math.min(maxX, _M.free.c + R) };
}

// Con vật luôn nằm ở lớp fixed; vị trí tính theo toạ độ màn hình
function _mRender(){
  if(!_M.run || !_M.lane) return;
  let px, py;
  _M.run.style.display = '';
  if(_M.drag){ px = _M.drag.px; py = _M.drag.py; }
  else if(_M.free){ px = _M.free.x; py = _M.free.y; }
  else {
    const lr = _M.lane.getBoundingClientRect();
    if(!lr.width){ _M.run.style.display = 'none'; return; }   // thanh nav đang ẩn
    px = lr.left + _M.x; py = lr.bottom - _M.size;
  }
  _M.run.style.transform = 'translate3d(' + px.toFixed(1) + 'px,' + py.toFixed(1) + 'px,0) scaleX(' + _M.dir + ')';
}

function _mascotUpdateRange(){
  if(!_M.lane) return;
  const range = _mRange();
  _M.walk = Math.max(18, range) / (((_M.cfg && _M.cfg.speed) || 18) / 2 * 0.96);
  _M.x = Math.min(_M.x, range);
  if(_M.center != null) _M.center = Math.min(_M.center, range);
  if(_M.free){                                    // xoay màn hình / đổi cỡ: giữ con vật trong màn hình
    const mx = Math.max(0, window.innerWidth - _M.size), my = Math.max(0, window.innerHeight - _M.size);
    _M.free.x = Math.min(_M.free.x, mx);
    _M.free.c = Math.min(_M.free.c, mx);
    _M.free.y = Math.min(_M.free.y, my);
  }
  _mRender();
}

function _mTick(t){
  _M.raf = requestAnimationFrame(_mTick);
  const dt = Math.min(0.05, (t - (_M.last || t)) / 1000);
  _M.last = t;

  if(_M.roam){
    _mStepRoam(dt);
  } else if(!_M.drag){
    if(_M.free){
      const b = _mFreeBounds();
      _M.free.x += _M.dir * _M.walk * dt;
      if(_M.free.x >= b.max){ _M.free.x = b.max; _M.dir = -1; }
      else if(_M.free.x <= b.min){ _M.free.x = b.min; _M.dir = 1; }
    } else {
      const b = _mBounds();
      _M.x += _M.dir * _M.walk * dt;
      if(_M.x >= b.max){ _M.x = b.max; _M.dir = -1; }
      else if(_M.x <= b.min){ _M.x = b.min; _M.dir = 1; }
    }
    _mRender();
  }
  if(_M.bubble && _M.bubble.classList.contains('show')) _mPlaceBubble();
  _mPlacePaw();
}

// ---------------------------------------------------------------------
// 1) KÉO THẢ: nhấp giữ -> kéo đi đâu cũng được -> thả
//    Thả trên thanh panel: vào lại panel. Thả ra ngoài: đứng đó, đi qua đi lại.
// ---------------------------------------------------------------------
function _mBindDrag(run){
  run.addEventListener('contextmenu', function(e){ e.preventDefault(); });

  run.addEventListener('pointerdown', function(e){
    if(_M.roam) return;
    e.preventDefault();
    try { run.setPointerCapture(e.pointerId); } catch(err){}
    const r = run.getBoundingClientRect();
    _M.drag = { offX: e.clientX - r.left, offY: e.clientY - r.top, lastX: e.clientX, px: r.left, py: r.top };
    run.classList.add('m-drag');
  });

  run.addEventListener('pointermove', function(e){
    const d = _M.drag;
    if(!d) return;
    d.px = Math.max(0, Math.min(window.innerWidth  - _M.size, e.clientX - d.offX));
    d.py = Math.max(0, Math.min(window.innerHeight - _M.size, e.clientY - d.offY));
    if(Math.abs(e.clientX - d.lastX) > 1){
      _M.dir = (e.clientX > d.lastX) ? 1 : -1;      // quay mặt theo hướng kéo
      d.lastX = e.clientX;
    }
    _mRender();
  });

  const drop = function(){
    const d = _M.drag;
    if(!d) return;
    _M.drag = null;
    run.classList.remove('m-drag');
    const nav = _M.lane.parentNode.getBoundingClientRect();
    const lr  = _M.lane.getBoundingClientRect();
    const cy  = d.py + _M.size / 2;
    if(lr.width && cy >= nav.top && cy <= nav.bottom){   // thả trên thanh nav -> vào lại panel
      _M.free = null;
      _M.x = Math.max(0, Math.min(_mRange(), d.px - lr.left));
      _M.center = _M.x;
    } else {                                             // thả ra ngoài -> đứng đó, đi lại quanh đó
      _M.free = { x: d.px, y: d.py, c: d.px };
    }
    _mRender();
  };
  run.addEventListener('pointerup', drop);
  run.addEventListener('pointercancel', drop);
}

// ---------------------------------------------------------------------
// 2) CHẠY ĂN MỪNG KHI LÊN ĐƠN
// ---------------------------------------------------------------------
function _mPlaceBubble(){
  const b = _M.bubble;
  if(!b) return;
  let r;
  if(_M.roam){            // bám theo vị trí tính toán (kể cả lúc nhảy), không bị giật khi xoay
    r = { left: _M.roam.x + (_M.roam.ox || 0), top: _M.roam.y + (_M.roam.oy || 0), width: _M.size, height: _M.size };
  } else {
    if(!_M.run) return;
    r = _M.run.getBoundingClientRect();
  }
  const dir = _M.roam ? _M.rdir : _M.dir;
  const bw = b.offsetWidth, bh = b.offsetHeight;
  const mx = r.left + r.width * (dir > 0 ? 0.92 : 0.08);
  const my = r.top + r.height * 0.42;
  let left = dir > 0 ? mx - bw * 0.72 : mx - bw * 0.28;
  left = Math.max(4, Math.min(window.innerWidth - bw - 4, left));
  const top = Math.max(4, my - bh - 10);
  const tail = Math.max(14, Math.min(bw - 14, mx - left));
  b.style.setProperty('--tail', tail + 'px');
  b.style.transform = 'translate3d(' + left.toFixed(1) + 'px,' + top.toFixed(1) + 'px,0)';
}
function _mShowBubble(text){
  clearTimeout(_M.hideT); clearTimeout(_M.fadeT);
  if(!_M.bubble){
    _M.bubble = document.createElement('div');
    _M.bubble.id = 'mascotBubble';
    document.body.appendChild(_M.bubble);
  }
  _M.bubble.textContent = text;
  _M.bubble.classList.add('show');
  _mPlaceBubble();
}

function _mHideBubble(delay){
  clearTimeout(_M.hideT);
  _M.hideT = setTimeout(function(){
    if(_M.bubble) _M.bubble.classList.remove('show');
    _M.fadeT = setTimeout(function(){
      if(_M.bubble){ _M.bubble.remove(); _M.bubble = null; }
    }, 320);
  }, delay);
}

// Chỉ chạy được khi tài khoản có linh vật (_M.run chỉ tồn tại với ID được chỉ định)
// Tạo lộ trình theo hành động. Điểm có "hold" = đến nơi thì đứng lại làm hiệu ứng (fx) trong hold giây
function _mBuildRoute(act, W, H, size, x0, y0){
  const pts = [];
  const cx = (W - size) / 2, cy = Math.max(4, (H - size) / 2);

  if(act === 'zigzag'){                              // quét ngang màn hình từ trên xuống
    const rows = 5, L = 4, R = Math.max(5, W - size - 4);
    const gap = Math.max(0, H - size - 8) / (rows - 1);
    const startRight = Math.random() < 0.5;
    for(let i = 0; i < rows; i++){
      const right = (i % 2 === 0) ? startRight : !startRight;
      pts.push({ x: right ? R : L, y: 4 + i * gap, s: 1.25 });
    }
  } else if(act === 'jump'){                         // chạy ra giữa rồi nhảy 3 cái
    pts.push({ x: cx, y: cy, s: 1.1, hold: 1.8, fx: 'jump' });
  } else if(act === 'spin'){                         // chạy ra giữa rồi xoay tít 3 vòng
    pts.push({ x: cx, y: cy, s: 1.1, hold: 1.6, fx: 'spin' });
  } else if(act === 'dance'){                        // chạy ra giữa rồi lắc lư nhún nhảy
    pts.push({ x: cx, y: cy, s: 1.1, hold: 2.2, fx: 'dance' });
  } else {                                           // 'run': chạy ngẫu nhiên MASCOT_ROAM_LAPS vòng
    const total = MASCOT_ROAM_LAPS * MASCOT_ROAM_POINTS;
    let px = x0, py = y0;
    for(let i = 0; i < total; i++){
      let nx, ny, tries = 0;
      do {
        nx = _mRand(4, Math.max(5, W - size - 4));
        ny = _mRand(4, Math.max(5, H - size - 4));
        tries++;
      } while(Math.hypot(nx - px, ny - py) < Math.min(W, H) * 0.35 && tries < 12);
      pts.push({ x: nx, y: ny, s: _mRand(0.85, 1.15) });
      px = nx; py = ny;
    }
  }
  return pts;
}

// text: lời thoại (tuỳ chọn) | act: ép 1 hành động để thử, vd mascotCelebrate('', 'spin')
function mascotCelebrate(text, act){
  if(!_M.run || _M.busy || _M.drag) return;
  if(_M.run.style.display === 'none') return;
  _M.busy = true;

  if(MASCOT_ACTIONS.indexOf(act) < 0){               // bốc ngẫu nhiên, tránh trùng lần trước
    const pool = MASCOT_ACTIONS.filter(function(a){ return a !== _mLastAct; });
    act = pool[Math.floor(Math.random() * pool.length)];
  }
  _mLastAct = act;

  const size = _M.size;
  const r0 = _M.run.getBoundingClientRect();

  const rm = document.createElement('div');
  rm.id = 'mascotRoamer';
  rm.style.setProperty('--m-size', size + 'px');
  rm.innerHTML = '<div class="mBody">' + _mAnimalSVG(_M.art) + '</div>';
  document.body.appendChild(rm);
  _M.roamer = rm;
  _M.run.style.visibility = 'hidden';

  const pts = _mBuildRoute(act, window.innerWidth, window.innerHeight, size, r0.left, r0.top);

  _M.rdir = _M.dir;
  _M.roam = { x: r0.left, y: r0.top, i: 0, pts: pts, hold: 0, holdTotal: 1, fx: '', ox: 0, oy: 0, act: act };
  _mApplyRoam(r0.left, r0.top, 0, 1);
  _mShowBubble(text || MASCOT_ROAM_TEXT);
}

function _mApplyRoam(x, y, rot, sc){
  if(!_M.roamer) return;
  _M.roamer.style.transform = 'translate3d(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px,0) rotate(' +
    rot.toFixed(1) + 'deg) scale(' + (_M.rdir * sc).toFixed(3) + ',' + sc.toFixed(3) + ')';
}

function _mStepRoam(dt){
  const r = _M.roam;
  if(!r || !_M.roamer) return;

  // Đang đứng lại làm hiệu ứng (nhảy / xoay / lắc)
  if(r.hold > 0){
    r.hold -= dt;
    const p = 1 - Math.max(0, r.hold) / r.holdTotal;      // tiến độ 0 -> 1
    let ox = 0, oy = 0, rot = 0, sc = 1;
    if(r.fx === 'jump'){                                   // 3 cú nhảy cao
      oy = -Math.abs(Math.sin(p * Math.PI * 3)) * Math.min(110, window.innerHeight * 0.25);
    } else if(r.fx === 'spin'){                            // xoay 3 vòng, hơi bay lên
      rot = p * 360 * 3;
      oy = -Math.sin(p * Math.PI) * 30;
    } else if(r.fx === 'dance'){                           // lắc qua lắc lại + nhún to nhỏ
      const w = Math.sin(p * Math.PI * 8);
      rot = w * 18; sc = 1 + Math.abs(w) * 0.15; ox = w * 8;
    }
    r.ox = ox; r.oy = oy;
    if(r.hold <= 0){ r.ox = 0; r.oy = 0; r.i++; rot = 0; sc = 1; ox = 0; oy = 0; }
    _mApplyRoam(r.x + ox, r.y + oy, rot, sc);
    return;
  }

  let tx, ty, sp;
  if(r.i < r.pts.length){
    tx = r.pts[r.i].x; ty = r.pts[r.i].y; sp = MASCOT_ROAM_SPEED * r.pts[r.i].s;
  } else {                                                 // chặng cuối: chạy về chỗ cũ
    const q = _M.run.getBoundingClientRect();
    tx = q.left; ty = q.top; sp = MASCOT_ROAM_SPEED;
  }
  const dx = tx - r.x, dy = ty - r.y, d = Math.hypot(dx, dy), step = sp * dt;
  if(Math.abs(dx) > 1.5) _M.rdir = dx > 0 ? 1 : -1;

  if(d <= step){
    r.x = tx; r.y = ty;
    if(r.i >= r.pts.length){ _mFinishRoam(); return; }
    const pt = r.pts[r.i];
    if(pt.hold){ r.hold = pt.hold; r.holdTotal = pt.hold; r.fx = pt.fx; }   // đến nơi -> làm hiệu ứng
    else r.i++;
  } else {
    r.x += dx / d * step;
    r.y += dy / d * step;
  }
  _mApplyRoam(r.x, r.y, 0, 1);
}

function _mFinishRoam(){
  if(_M.roamer){ _M.roamer.remove(); _M.roamer = null; }
  if(_M.run) _M.run.style.visibility = '';
  _M.dir = _M.rdir;
  _M.roam = null;
  _M.busy = false;
  _mRender();
  _mHideBubble(MASCOT_BUBBLE_STAY);              // bong bóng còn ở lại miệng một lúc rồi mờ dần
}

// Bắt nút "XÁC NHẬN LƯU ĐƠN": chữ nút đổi "Đang lưu..." -> "✔ XÁC NHẬN LƯU ĐƠN" khi server lưu xong.
// (Cách chính xác hơn: gọi mascotCelebrate() trong hàm xử lý THÀNH CÔNG của lệnh lưu đơn ở script chính.
//  Có cờ busy nên gọi cả hai cách cũng không chạy 2 lần.)
function _mWatchSave(){
  if(_M.obs) return;
  const btn = document.getElementById('btnSubmitOrder');
  if(!btn){ _M.obsT = setTimeout(_mWatchSave, 1500); return; }   // nút chưa có thì đợi rồi thử lại
  let saving = false;
  _M.obs = new MutationObserver(function(){
    const txt = btn.textContent || '';
    if(txt.indexOf('Đang lưu') >= 0){ saving = true; return; }
    if(saving){ saving = false; setTimeout(function(){ mascotCelebrate(); }, 300); }
  });
  _M.obs.observe(btn, { childList: true, characterData: true, subtree: true });
}

// ---------------------------------------------------------------------
// 3) NÚT 🐾 ĐỔI LINH VẬT
//    Chỉ ID có linh vật mới có nút. Bấm -> popup 12 con giáp -> chọn là đổi ngay.
//    Lựa chọn được nhớ theo ID trên chính thiết bị này (localStorage).
// ---------------------------------------------------------------------
const MASCOT_PICK_LIST = ['chuot','trau','cop','meo','rong','ran','ngua','de','de2','khi','ga','cho','heo'];   // 12 con giáp + dê béo
// Nếu nút 🐾 không bám đúng sau tên: điền selector của phần tử chứa tên, vd '#navUserName' hoặc '.nav-name'
const MASCOT_NAME_SELECTOR = '';
const MASCOT_SAVE_PREFIX = 'mascot_pick_';

function _mHas(o, k){ return Object.prototype.hasOwnProperty.call(o, k); }

function _mLoadPick(id){
  try { const k = localStorage.getItem(MASCOT_SAVE_PREFIX + id); return (k && _mHas(MASCOT_ART, k)) ? k : ''; }
  catch(e){ return ''; }
}
function _mSavePick(id, key){
  try { localStorage.setItem(MASCOT_SAVE_PREFIX + id, key); } catch(e){}
}

// Tìm phần tử chứa tên người dùng: chữ đầu tiên (không nằm trong nút bấm) trên thanh nav
function _mFindNameEl(nav){
  if(MASCOT_NAME_SELECTOR){
    const el = nav.querySelector(MASCOT_NAME_SELECTOR);
    if(el) return el;
  }
  const all = nav.querySelectorAll('*');
  for(let i = 0; i < all.length; i++){
    const el = all[i];
    if(el.children.length || !(el.textContent || '').trim()) continue;   // chỉ lấy phần tử lá có chữ
    if(el.closest('button, a, .btn, #mascotLane')) continue;             // bỏ qua nút (☰, Làm mới, đăng xuất...)
    if(!el.getClientRects().length) continue;                            // bỏ qua phần tử đang ẩn
    return el;
  }
  return null;
}

function _mPawHide(){
  if(_M.paw && _M.pawOn){ _M.paw.style.display = 'none'; _M.pawOn = false; }
}

// Chạy mỗi khung hình: đặt nút 🐾 ngay bên phải chữ tên (theo bề rộng chữ thật)
function _mPlacePaw(){
  const p = _M.paw;
  if(!p || !_M.lane) return;
  const nav = _M.lane.parentNode;
  const nb = nav.getBoundingClientRect();
  if(!nb.width || !nb.height){ _mPawHide(); return; }               // thanh nav đang ẩn

  if(!_M.nameEl || !_M.nameEl.isConnected){
    _M.nameEl = (_M.pawTry++ % 30 === 0) ? _mFindNameEl(nav) : null; // không thấy thì thử lại thưa thưa
  }
  const n = _M.nameEl;
  if(!n){ _mPawHide(); return; }

  if(!_M.rg) _M.rg = document.createRange();
  _M.rg.selectNodeContents(n);
  const tr = _M.rg.getBoundingClientRect(), nr = n.getBoundingClientRect();
  if(!nr.width && !tr.width){ _mPawHide(); return; }
  const right = tr.width ? Math.min(tr.right, nr.right || tr.right) : nr.right;
  const top = tr.height ? tr.top + (tr.height - 28) / 2 : nr.top + (nr.height - 28) / 2;
  const x = Math.min(right + 6, window.innerWidth - 32);

  const t = 'translate3d(' + x.toFixed(1) + 'px,' + top.toFixed(1) + 'px,0)';
  if(t !== _M.pawT){ p.style.transform = t; _M.pawT = t; }
  if(!_M.pawOn){ p.style.display = 'block'; _M.pawOn = true; }
}

function _mMountPaw(){
  const p = document.createElement('button');
  p.id = 'mascotPaw';
  p.type = 'button';
  p.textContent = '🐾';
  p.setAttribute('aria-label', 'Đổi linh vật');
  p.addEventListener('click', function(e){
    e.stopPropagation();
    if(_M.pickBack) _mClosePicker(); else _mOpenPicker();
  });
  document.body.appendChild(p);
  _M.paw = p;
}

// Đổi con vật đang chạy (kể cả khi đang chạy ăn mừng)
function _mSetAnimal(key, save){
  key = _mKey(key);
  _M.animal = key;
  _M.art = MASCOT_ART[key];
  const html = '<div class="mBody">' + _mAnimalSVG(_M.art) + '</div>';
  if(_M.run) _M.run.innerHTML = html;
  if(_M.roamer) _M.roamer.innerHTML = html;
  if(save) _mSavePick(_M.uid, key);
}

function _mOpenPicker(){
  if(_M.pickBack || !_M.run || !_M.lane) return;
  const nav = _M.lane.parentNode.getBoundingClientRect();
  const back = document.createElement('div');
  back.id = 'mascotPickBack';
  back.style.paddingTop = Math.max(8, nav.bottom + 8) + 'px';

  let h = '<div id="mascotPicker" role="dialog" aria-label="Chọn linh vật">' +
          '<div class="mpHead"><span>🐾 Chọn linh vật của bạn</span>' +
          '<button type="button" class="mpX" aria-label="Đóng">✕</button></div><div class="mpGrid">';
  MASCOT_PICK_LIST.forEach(function(k){
    const nm = MASCOT_NAMES[k].split(' (');
    const on = (k === _M.animal);
    h += '<button type="button" class="mpItem' + (on ? ' on' : '') + '" data-k="' + k + '">' +
         '<div class="mBody">' + _mAnimalSVG(MASCOT_ART[k]) + '</div>' + nm[0] +
         '<small>' + (nm[1] || '').replace(')', '') + '</small></button>';
  });
  back.innerHTML = h + '</div></div>';

  back.addEventListener('click', function(e){
    if(e.target === back || e.target.closest('.mpX')){ _mClosePicker(); return; }
    const it = e.target.closest('.mpItem');
    if(it) _mChoose(it.getAttribute('data-k'));
  });
  document.body.appendChild(back);
  _M.pickBack = back;
  requestAnimationFrame(function(){ back.classList.add('show'); });
}

function _mClosePicker(){
  const b = _M.pickBack;
  if(!b) return;
  _M.pickBack = null;
  b.classList.remove('show');
  setTimeout(function(){ b.remove(); }, 200);
}

function _mChoose(key){
  if(!_mHas(MASCOT_ART, key)) return;
  _mSetAnimal(key, true);
  if(_M.pickBack){
    _M.pickBack.querySelectorAll('.mpItem').forEach(function(b){
      b.classList.toggle('on', b.getAttribute('data-k') === key);
    });
  }
  const nm = MASCOT_NAMES[key].split(' (')[0];
  setTimeout(function(){
    _mClosePicker();
    if(_M.run && !_M.busy){ _mShowBubble('Mình là ' + nm + ' nè! 🐾'); _mHideBubble(1800); }
  }, 260);
}

// ---------------------------------------------------------------------
function removeMascot(){
  cancelAnimationFrame(_M.raf);
  clearTimeout(_M.hideT); clearTimeout(_M.fadeT); clearTimeout(_M.obsT);
  if(_M.obs){ _M.obs.disconnect(); _M.obs = null; }
  if(_M.roamer) _M.roamer.remove();
  if(_M.bubble) _M.bubble.remove();
  if(_M.run) _M.run.remove();
  if(_M.paw) _M.paw.remove();
  if(_M.pickBack) _M.pickBack.remove();
  _M.paw = null; _M.pickBack = null; _M.nameEl = null; _M.pawT = ''; _M.pawOn = false; _M.pawTry = 0;
  const lane = document.getElementById('mascotLane');
  if(lane) lane.remove();
  window.removeEventListener('resize', _mascotUpdateRange);
  _M.raf = 0; _M.lane = null; _M.run = null; _M.roamer = null; _M.bubble = null;
  _M.roam = null; _M.drag = null; _M.busy = false; _M.center = null; _M.free = null;
}

function initMascot(){
  removeMascot();                                   // tránh tạo trùng khi đăng nhập lại
  if(typeof user === 'undefined' || !user) return;

  const id = String(user.userId || '').trim().toLowerCase();

  if(!_mascotIsMobile()) return;                    // chỉ điện thoại
  const cfg = _mascotPick(id);
  if(!cfg) return;                                  // ID không được chỉ định -> không có gì hết

  const nav = document.querySelector('.top-nav');
  if(!nav) return;

  const key = _mKey(_mLoadPick(id) || cfg.animal);   // ưu tiên con đã chọn bằng nút 🐾
  const art = MASCOT_ART[key];

  const lane = document.createElement('div');       // lane rỗng, chỉ giữ chỗ trên thanh panel
  lane.id = 'mascotLane';
  nav.appendChild(lane);

  const run = document.createElement('div');        // con vật nằm ở lớp fixed của trang
  run.id = 'mascotRunner';
  run.style.setProperty('--m-size', (cfg.size || 44) + 'px');
  run.innerHTML = '<div class="mBody">' + _mAnimalSVG(art) + '</div>';
  document.body.appendChild(run);

  _M.lane = lane; _M.run = run; _M.art = art; _M.cfg = cfg;
  _M.animal = key; _M.uid = id;
  _M.size = cfg.size || 44;
  _M.x = 0; _M.dir = 1; _M.center = null; _M.free = null; _M.last = 0;

  _mBindDrag(run);
  _mascotUpdateRange();
  window.addEventListener('resize', _mascotUpdateRange);
  _M.raf = requestAnimationFrame(_mTick);
  _mWatchSave();                                    // chỉ gắn cho ID được chỉ định
  _mMountPaw();                                     // nút 🐾 đổi linh vật (cũng chỉ cho ID được chỉ định)
}

// Xem thử tất cả linh vật (gõ mascotDemo() trong Console, bấm vào màn hình để đóng)
// Chỉ tài khoản có linh vật mới mở được.
function mascotDemo(){
  if(!_M.run) return;
  const old = document.getElementById('mascotDemo');
  if(old){ old.remove(); return; }
  const w = document.createElement('div');
  w.id = 'mascotDemo';
  w.style.cssText = 'position:fixed;inset:0;z-index:100010;background:#fff;overflow:auto;display:grid;' +
                    'grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;padding:16px;align-content:start';
  w.innerHTML = Object.keys(MASCOT_ART).map(function(k){
    return '<div style="text-align:center;font:600 13px sans-serif;color:#222">' +
           '<div class="mBody" style="width:96px;height:96px;margin:0 auto 6px">' + _mAnimalSVG(MASCOT_ART[k]) + '</div>' +
           MASCOT_NAMES[k] + '<br><small style="font-weight:400;color:#888">' + k + '</small></div>';
  }).join('');
  w.onclick = function(){ w.remove(); };
  document.body.appendChild(w);
}
</script>
