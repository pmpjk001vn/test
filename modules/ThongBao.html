<!--
  ============================================================
   ThongBao.html — CHUÔNG THÔNG BÁO HÓA ĐƠN CHƯA IN + HEO CHẠY "ÉC ÉC"
   File riêng, đi cùng ThongBao.gs

   Cách gắn: Apps Script > dấu + > HTML > đặt tên "ThongBao" > dán toàn bộ file này.
   Rồi trong Index.html, NGAY TRƯỚC thẻ </body> (sau dòng include script chính) thêm:
        <?!= include('ThongBao'); ?>

   BẢN NÀY:
   - Heo là sticker hoạt hình nguyên con (SVG tự vẽ): 4 chân chạy, tai vẫy, đuôi xoắn, viền trắng kiểu sticker,
     chạy vòng quanh màn hình và xoay đầu theo hướng chạy.
   - Có đơn mới là báo (rung chuông + heo + éc éc); nhiều đơn đến liên tiếp thì heo chạy nối tiếp, không bỏ sót.
   - Admin bấm in xong thì chuông quét lại ngay; đơn đã in không còn nằm trong danh sách chờ in.
   - TOÀN BỘ phần này (chuông, heo, bong bóng, tiếng kêu) CHỈ DÀNH CHO ADMIN. Sale / leader / vai trò khác không thấy và không nghe gì.
   - Heo + bong bóng + tiếng kêu CHỈ chạy trên LAPTOP / máy tính. Trên ĐIỆN THOẠI (và máy tính bảng) chỉ có chuông rung + số đỏ.
   - Heo chạy ra có bong bóng chữ "Có Toa Mới" ngay miệng. Trong menu chuông có nút tắt/bật TIẾNG và tắt/bật HÌNH heo.
  ============================================================
-->
<style>
/* ===== CHUÔNG ===== */
.adb-bell-wrap{position:relative;display:inline-flex;align-items:center;margin-right:8px;vertical-align:middle;flex:0 0 auto}
.adb-bell-wrap.adb-fixed{position:fixed;top:10px;right:76px;z-index:99980;margin:0}
.adb-bell{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.adb-bell:hover{background:rgba(255,255,255,.28)}
.adb-bell:active{transform:scale(.92)}
.adb-bell svg{display:block}
.adb-bell.ring svg{transform-origin:50% 8%;animation:adb-ring 1.1s ease}
@keyframes adb-ring{0%,100%{transform:rotate(0)}10%{transform:rotate(18deg)}20%{transform:rotate(-16deg)}30%{transform:rotate(13deg)}40%{transform:rotate(-11deg)}50%{transform:rotate(7deg)}60%{transform:rotate(-4deg)}70%{transform:rotate(0)}}
.adb-badge{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;padding:0 4px;border-radius:10px;background:#ef4444;color:#fff;font:800 11px/15px system-ui,-apple-system,sans-serif;text-align:center;border:2px solid #fff;box-sizing:border-box;pointer-events:none}

/* ===== DROPDOWN DANH SÁCH ===== */
.adb-menu{position:fixed;z-index:99990;background:#fff;border:1px solid #e5e7eb;border-radius:14px;box-shadow:0 14px 40px rgba(15,23,42,.25);display:none;overflow:hidden;color:#111827;font-family:inherit}
.adb-menu.show{display:block;animation:adb-pop .16s ease-out}
@keyframes adb-pop{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
.adb-mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:linear-gradient(135deg,#1a56db,#4f8df7);color:#fff;font-weight:800;font-size:13px}
.adb-cnt{background:rgba(255,255,255,.25);padding:2px 10px;border-radius:12px;font-size:12px}
.adb-list{max-height:min(50vh,360px);overflow-y:auto;-webkit-overflow-scrolling:touch}
.adb-item{padding:10px 14px;border-bottom:1px solid #eef0f4;cursor:pointer}
.adb-item:hover{background:#f3f6ff}
.adb-r{display:flex;justify-content:space-between;align-items:center;gap:8px}
.adb-id{color:#1a56db;font-size:13px}
.adb-t{color:#6b7280;font-size:11px}
.adb-c{font-weight:700;font-size:13px;margin:2px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adb-s{color:#6b7280;font-size:11px}
.adb-m{color:#dc2626;font-size:13px}
.adb-more{padding:8px 14px;text-align:center;font-size:12px;color:#6b7280;font-style:italic}
.adb-empty{padding:26px 14px;text-align:center;color:#6b7280;font-size:13px;font-weight:600}
.adb-mf{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:#f8fafc;border-top:1px solid #e5e7eb}
.adb-mf button{flex:1 1 0;min-width:0;white-space:nowrap;border:1px solid #d1d5db;background:#fff;border-radius:9px;padding:8px 4px;font-size:12px;font-weight:700;cursor:pointer;color:#374151;font-family:inherit}
.adb-mf button.pri{flex:1 1 100%;background:#1a56db;border-color:#1a56db;color:#fff}

/* ===== HEO CHẠY (sticker hoạt hình vẽ bằng SVG) ===== */
.adb-pig{position:fixed;left:0;top:0;z-index:2147483000;pointer-events:none;will-change:transform}
/* 4 lớp drop-shadow trắng = viền sticker; lớp cuối là bóng đổ nhẹ */
.adb-pig svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 5px 6px rgba(0,0,0,.3))}
.adb-pig .bob{animation:adb-bob .22s ease-in-out infinite alternate}
.adb-pig .leg{transform-box:fill-box;transform-origin:50% 0;animation:adb-leg .22s ease-in-out infinite alternate}
.adb-pig .leg.b{animation-direction:alternate-reverse}
.adb-pig .ear{transform-box:fill-box;transform-origin:50% 100%;animation:adb-ear .22s ease-in-out infinite alternate}
.adb-pig .tail{transform-box:fill-box;transform-origin:100% 100%;animation:adb-tail .22s ease-in-out infinite alternate}
.adb-pig .eye{transform-box:fill-box;transform-origin:50% 50%;animation:adb-blink 2.6s infinite}
.adb-pig .dust{transform-box:fill-box;transform-origin:50% 50%;opacity:0;animation:adb-dust .66s ease-out infinite}
.adb-pig .dust.d2{animation-delay:.22s}
.adb-pig .dust.d3{animation-delay:.44s}
@keyframes adb-bob{from{transform:translateY(1px)}to{transform:translateY(-3px)}}
@keyframes adb-leg{from{transform:rotate(32deg)}to{transform:rotate(-32deg)}}
@keyframes adb-ear{from{transform:rotate(-9deg)}to{transform:rotate(12deg)}}
@keyframes adb-tail{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes adb-blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes adb-dust{0%{opacity:.95;transform:translateX(0) scale(.5)}100%{opacity:0;transform:translateX(-20px) scale(1.5)}}

/* Bong bóng chữ ở miệng heo (không xoay theo heo để chữ luôn thẳng) */
.adb-say{position:fixed;left:0;top:0;z-index:2147483001;pointer-events:none;opacity:0;will-change:transform;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.adb-say-body{display:block;white-space:nowrap;background:#fff;color:#c2255c;border:2px solid #b5476f;border-radius:10px;padding:4px 11px;font:800 13px/18px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.2px;animation:adb-say-pop .3s cubic-bezier(.2,1.5,.4,1) both}
.adb-say-tail{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
@keyframes adb-say-pop{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
</style>

<script>
(function () {
  'use strict';

  /* =========================== CẤU HÌNH =========================== */
  const CFG = {
    roles: ['admin'],              // CHỈ admin dùng chuông + heo + tiếng (muốn cho thêm vai trò nào thì thêm vào đây, vd 'leader')
    pollMs: 15000,                 // chuông tự cập nhật mỗi 15 giây (Apps Script có hạn mức chạy/ngày, đừng đặt quá thấp)
    newWindowMs: 20 * 60 * 1000,   // chỉ coi là "đơn mới" nếu được tạo trong 20 phút gần đây
    pigMs: 9000,                   // thời gian heo chạy hết 1 vòng (ms) — số càng lớn heo càng chậm
    pigText: 'Có Toa Mới Kìa',         // chữ trong bong bóng ở miệng heo (để trống '' = không hiện bong bóng)
    mobileSound: false,            // điện thoại: false = im lặng hoàn toàn (chỉ chuông + số); true = vẫn kêu "ủn ỉn" nhẹ
    volume: 1,                     // âm lượng tiếng heo (0.5 = nhỏ bớt, 1.5 = to hơn)
    pigSoundUrl: '',               // để trống = dùng tiếng éc éc tự tạo; hoặc dán link file .mp3 của bạn
    anchorSelector: 'button[onclick*="refreshCurrentData"]',   // nút "Làm mới" để gắn chuông bên cạnh
    // Nút "In" của app: bấm vào là chuông quét lại để đơn vừa in biến mất khỏi danh sách chờ in.
    // Nếu nút in của bạn gọi hàm tên khác (vd inHoaDon), thêm vào đây: '[onclick*="rint"],[onclick*="inHoaDon"]'
    printSelector: '[onclick*="rint"]'
  };

  const BELL_SVG = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>';

  // Heo hoạt hình nhìn nghiêng, quay mặt sang phải. Chân/tai/đuôi/mắt/bụi động nhờ CSS ở trên.
  const PIG_SVG =
    '<svg viewBox="0 -8 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">' +
    '<defs>' +
    '<radialGradient id="adbpB" cx=".38" cy=".25" r=".85"><stop offset="0" stop-color="#ffd9e4"/><stop offset=".55" stop-color="#ffb4ca"/><stop offset="1" stop-color="#f58eaf"/></radialGradient>' +
    '<radialGradient id="adbpH" cx=".4" cy=".28" r=".8"><stop offset="0" stop-color="#ffdde8"/><stop offset=".6" stop-color="#ffb6cc"/><stop offset="1" stop-color="#f78fb0"/></radialGradient>' +
    '<radialGradient id="adbpS" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#ffbdd0"/><stop offset="1" stop-color="#ff86a7"/></radialGradient>' +
    '<linearGradient id="adbpL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffa3be"/><stop offset="1" stop-color="#f27da1"/></linearGradient>' +
    '</defs>' +
    '<g fill="#fff0f5" stroke="#b5476f" stroke-width="1.6">' +
    '<circle class="dust d1" cx="9" cy="98" r="4"/>' +
    '<circle class="dust d2" cx="9" cy="98" r="3"/>' +
    '<circle class="dust d3" cx="9" cy="98" r="3.5"/>' +
    '</g>' +
    '<g class="bob" stroke="#b5476f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round">' +
    '<path class="tail" d="M16 64C4 66 0 52 8 49C14 47 17 54 11 55" fill="none" stroke-width="3"/>' +
    '<g class="leg"><rect x="20" y="74" width="12" height="28" rx="6" fill="#ee7fa3"/><rect x="20" y="94" width="12" height="8" rx="4" fill="#c25a7e"/></g>' +
    '<g class="leg b"><rect x="58" y="74" width="12" height="28" rx="6" fill="#ee7fa3"/><rect x="58" y="94" width="12" height="8" rx="4" fill="#c25a7e"/></g>' +
    '<g class="leg b"><rect x="34" y="74" width="12" height="28" rx="6" fill="url(#adbpL)"/><rect x="34" y="94" width="12" height="8" rx="4" fill="#c25a7e"/></g>' +
    '<g class="leg"><rect x="72" y="74" width="12" height="28" rx="6" fill="url(#adbpL)"/><rect x="72" y="94" width="12" height="8" rx="4" fill="#c25a7e"/></g>' +
    '<rect x="12" y="40" width="76" height="52" rx="26" fill="url(#adbpB)"/>' +
    '<ellipse cx="50" cy="85" rx="19" ry="5" fill="#ffe3ec" stroke="none" opacity=".9"/>' +
    '<ellipse cx="30" cy="55" rx="9" ry="6" fill="#ff93b3" stroke="none" opacity=".55"/>' +
    '<ellipse cx="33" cy="47" rx="12" ry="3.2" fill="#fff" stroke="none" opacity=".4"/>' +
    '<path class="ear" d="M92 36C94 22 108 20 110 30C109 35 104 38 100 40Z" fill="#ee7fa3"/>' +
    '<circle cx="82" cy="56" r="24" fill="url(#adbpH)"/>' +
    '<ellipse cx="104" cy="62" rx="11.5" ry="9.5" fill="url(#adbpS)"/>' +
    '<ellipse cx="101" cy="57.5" rx="3.4" ry="1.5" fill="#fff" stroke="none" opacity=".55"/>' +
    '<ellipse cx="100.5" cy="63" rx="2.1" ry="3.3" fill="#a63d62" stroke="none"/>' +
    '<ellipse cx="107.5" cy="63" rx="2.1" ry="3.3" fill="#a63d62" stroke="none"/>' +
    '<ellipse cx="78" cy="66" rx="6" ry="3.8" fill="#ff6b94" opacity=".5" stroke="none"/>' +
    '<path d="M85 71Q89 75 93 72" fill="none" stroke-width="1.8"/>' +
    '<path d="M83 41Q88 38 93 41" fill="none" stroke-width="1.8"/>' +
    '<g class="eye" stroke="none"><ellipse cx="88" cy="50" rx="4.6" ry="5.6" fill="#2b1520"/><circle cx="89.7" cy="47.6" r="1.9" fill="#fff"/><circle cx="86.6" cy="52.6" r=".9" fill="#fff"/></g>' +
    '<g class="ear"><path d="M68 42C62 24 76 14 90 22C92 28 86 36 82 40Z" fill="url(#adbpH)"/><path d="M72 36C69 27 77 21 84 25C85 29 82 33 80 35Z" fill="#ff7fa3" stroke="none"/></g>' +
    '</g></svg>';

  /* ============================ TRẠNG THÁI ============================ */
  let bells = [];
  let menu = null;
  let activeKey = '';
  let timer = null;
  let inflightAt = 0;
  let seeded = false;
  let known = new Set();
  let lastList = [];
  let lastCount = 0;
  let lastSelfSaveAt = 0;
  let pigRunning = false;
  let pigQueued = false;
  let submitWatched = false;
  let muted = false;
  let hidePig = false;
  try { muted = localStorage.getItem('adb_bell_mute') === '1'; } catch (e) {}
  try { hidePig = localStorage.getItem('adb_pig_hide') === '1'; } catch (e) {}

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fmt = n => Number(n || 0).toLocaleString('vi-VN');

  // Điện thoại / máy tính bảng (cảm ứng) → chỉ hiện chuông + số. Laptop / máy tính → có heo + tiếng.
  function isMobile() {
    try {
      const ua = navigator.userAgent || '';
      if (navigator.userAgentData && navigator.userAgentData.mobile) return true;
      if (/Android|iPhone|iPad|iPod|Mobile|Windows Phone|Opera Mini/i.test(ua)) return true;
      if (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;     // iPad bật chế độ "trang web cho máy tính"
      // Điện thoại bật "xem bản máy tính": UA giống laptop nhưng vẫn là màn cảm ứng nhỏ
      if (window.matchMedia && window.matchMedia('(pointer:coarse)').matches && Math.min(screen.width, screen.height) < 900) return true;
    } catch (e) {}
    return false;
  }

  // `user` là biến toàn cục của app (đã có sẵn trong script chính)
  function curUser() {
    try { return (typeof user !== 'undefined' && user && user.token) ? user : null; } catch (e) { return null; }
  }
  // Chỉ admin mới được thấy/nghe heo
  function isAdmin() {
    const u = curUser();
    return !!u && String(u.role || '').trim().toLowerCase() === 'admin';
  }
  /* ============================== CHUÔNG ============================== */
  function makeBell() {
    const w = document.createElement('span');
    w.className = 'adb-bell-wrap';
    w.innerHTML =
      '<button type="button" class="adb-bell" aria-label="Hóa đơn chưa in" title="Hóa đơn chưa in">' + BELL_SVG + '</button>' +
      '<span class="adb-badge" style="display:none">0</span>';
    w.querySelector('.adb-bell').addEventListener('click', () => toggleMenu(w));
    return w;
  }

  function mount() {
    if (bells.length && bells.every(b => document.body.contains(b))) {
      bells.forEach(b => { b.style.display = ''; });
      return;
    }
    bells.forEach(b => b.remove());
    bells = [];
    const w = makeBell();
    const anchors = Array.from(document.querySelectorAll(CFG.anchorSelector));
    const anchor = anchors.find(a => a.offsetParent !== null) || anchors[0];
    if (anchor && anchor.parentNode) {
      anchor.parentNode.insertBefore(w, anchor);      // ngay bên trái nút "Làm mới"
    } else {
      w.classList.add('adb-fixed');                   // không tìm thấy nút → gắn cố định góc phải trên
      document.body.appendChild(w);
    }
    bells.push(w);
    render();
  }

  function render() {
    const n = lastCount;
    bells.forEach(w => {
      const badge = w.querySelector('.adb-badge');
      badge.textContent = n > 99 ? '99+' : String(n);
      badge.style.display = n > 0 ? 'block' : 'none';
      w.querySelector('.adb-bell').title = n > 0 ? (n + ' hóa đơn chưa in') : 'Không có hóa đơn chờ in';
    });
  }

  function ring() {
    bells.forEach(w => {
      const b = w.querySelector('.adb-bell');
      b.classList.remove('ring');
      void b.offsetWidth;
      b.classList.add('ring');
    });
  }

  /* ============================== DROPDOWN ============================== */
  function ensureMenu() {
    if (menu) return;
    menu = document.createElement('div');
    menu.className = 'adb-menu';
    menu.addEventListener('click', onMenuClick);
    document.body.appendChild(menu);
    document.addEventListener('click', e => {
      if (menu.classList.contains('show') && !menu.contains(e.target) && !e.target.closest('.adb-bell-wrap')) closeMenu();
    });
    window.addEventListener('resize', closeMenu);
  }

  function toggleMenu(wrap) {
    ensureMenu();
    if (menu.classList.contains('show')) { closeMenu(); return; }
    renderMenu();
    const r = wrap.getBoundingClientRect();
    const vw = window.innerWidth;
    const w = Math.min(340, vw - 16);
    let left = r.right - w;
    if (left < 8) left = 8;
    if (left + w > vw - 8) left = vw - w - 8;
    menu.style.width = w + 'px';
    menu.style.left = left + 'px';
    menu.style.top = (r.bottom + 8) + 'px';
    menu.classList.add('show');
    poll();   // mở chuông là cập nhật luôn cho chắc
  }

  function closeMenu() { if (menu) menu.classList.remove('show'); }

  function renderMenu() {
    if (!menu) return;
    const mob = isMobile();
    let body;
    if (!lastList.length) {
      body = '<div class="adb-empty">🎉 Không có hóa đơn nào đang chờ in</div>';
    } else {
      body = '<div class="adb-list">' + lastList.map(o =>
        '<div class="adb-item" data-id="' + esc(o.id) + '">' +
          '<div class="adb-r"><b class="adb-id">' + esc(o.id) + '</b><span class="adb-t">' + esc(o.time) + '</span></div>' +
          '<div class="adb-c">' + esc(o.cust || 'Khách lẻ') + '</div>' +
          '<div class="adb-r"><span class="adb-s">NV: ' + esc(o.sale) + '</span><b class="adb-m">' + fmt(o.total) + 'đ</b></div>' +
        '</div>').join('') +
        (lastCount > lastList.length ? '<div class="adb-more">… và ' + (lastCount - lastList.length) + ' đơn khác</div>' : '') +
        '</div>';
    }
    menu.innerHTML =
      '<div class="adb-mh"><span>🔔 Hóa đơn chưa in</span><span class="adb-cnt">' + lastCount + '</span></div>' +
      body +
      '<div class="adb-mf">' +
        '<button type="button" class="pri" data-act="history">📋 Danh sách đơn</button>' +
        // điện thoại: chỉ có "Danh sách đơn" (heo + tiếng chỉ dành cho laptop)
        (mob && !CFG.mobileSound ? '' : '<button type="button" data-act="mute">' + (muted ? '🔇 Tiếng: Tắt' : '🔊 Tiếng: Bật') + '</button>') +
        (mob ? '' : '<button type="button" data-act="pig">' + (hidePig ? '🚫 Hình: Tắt' : '🖼️ Hình: Bật') + '</button>') +
        (mob ? '' : '<button type="button" data-act="test">🐷 Thử</button>') +
      '</div>';
  }

  function onMenuClick(e) {
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.getAttribute('data-act');
      if (a === 'history') {
        closeMenu();
        if (typeof showPage === 'function') showPage('history');
      } else if (a === 'mute') {
        muted = !muted;
        try { localStorage.setItem('adb_bell_mute', muted ? '1' : '0'); } catch (x) {}
        renderMenu();
      } else if (a === 'pig') {
        hidePig = !hidePig;
        try { localStorage.setItem('adb_pig_hide', hidePig ? '1' : '0'); } catch (x) {}
        renderMenu();
      } else if (a === 'test') {
        closeMenu();
        ring();
        runPig();
      }
      return;
    }
    const it = e.target.closest('.adb-item');
    if (it) openOrder(it.getAttribute('data-id'));
  }

  function openOrder(id) {
    closeMenu();
    try {
      const has = typeof db !== 'undefined' && db && (db.history || []).some(x => String(x.id).trim() === String(id).trim());
      if (has && typeof viewDetail === 'function') viewDetail(id);
      else if (typeof showPage === 'function') showPage('history');
    } catch (e) {}
  }

  /* ============================ ĐỒNG BỘ DỮ LIỆU ============================ */
  function poll() {
    const u = curUser();
    if (!u || !activeKey) return;
    if (inflightAt && Date.now() - inflightAt < 30000) return;
    inflightAt = Date.now();
    google.script.run
      .withSuccessHandler(res => { inflightAt = 0; onData(res); })
      .withFailureHandler(() => { inflightAt = 0; })
      .getPendingPrintOrders(u.token);
  }

  function onData(res) {
    if (!activeKey || !res || !res.success) return;
    const list = res.list || [];
    const nowSrv = res.serverTime || Date.now();

    // Đơn "mới" = chưa thấy ở lần quét trước + vừa được tạo gần đây. Lần quét đầu chỉ ghi nhớ, không kêu.
    const fresh = seeded
      ? list.filter(o => !known.has(o.id) && o.ts && (nowSrv - o.ts) < CFG.newWindowMs)
      : [];

    // Danh sách luôn lấy nguyên từ server: đơn nào admin đã in (server không còn trả về) sẽ tự biến mất khỏi chuông.
    known = new Set(list.map(o => o.id));
    seeded = true;

    lastList = list;
    lastCount = res.count || 0;
    render();
    if (menu && menu.classList.contains('show')) renderMenu();

    if (fresh.length) {
      ring();
      // Chỉ bỏ qua heo khi đơn mới duy nhất chính là đơn máy này vừa tự lưu (heo đã chạy lúc bấm lưu rồi)
      const ownOnly = fresh.length === 1 && (Date.now() - lastSelfSaveAt) < 20000;
      if (!ownOnly) runPig();
    }
  }

  // Theo dõi đăng nhập / đăng xuất để bật tắt chuông (không cần sửa hàm login/logout cũ)
  function sync() {
    if (!submitWatched) watchSubmit();
    const u = curUser();
    const role = u ? String(u.role || '').trim().toLowerCase() : '';
    const key = (u && CFG.roles.indexOf(role) >= 0) ? (String(u.userId) + '|' + role) : '';
    if (key === activeKey) return;

    activeKey = key;
    if (timer) { clearInterval(timer); timer = null; }
    if (!key) {
      bells.forEach(b => { b.style.display = 'none'; });
      closeMenu();
      return;
    }
    ensureMenu();
    mount();
    known = new Set();
    seeded = false;
    lastList = [];
    lastCount = 0;
    render();
    poll();
    timer = setInterval(poll, CFG.pollMs);
  }

  /* ============ BẤM "XÁC NHẬN LƯU ĐƠN" (chỉ admin mới có heo kêu ở máy mình) ============ */
  // Nút lưu đổi chữ "Đang lưu..." → "✔ XÁC NHẬN LƯU ĐƠN" khi server lưu xong => coi là lưu thành công
  function watchSubmit() {
    const btn = document.getElementById('btnSubmitOrder');
    if (!btn) return;
    submitWatched = true;
    let saving = false;
    new MutationObserver(() => {
      const txt = btn.textContent || '';
      if (txt.indexOf('Đang lưu') >= 0) { saving = true; return; }
      if (saving) { saving = false; onOrderSaved(); }
    }).observe(btn, { childList: true, characterData: true, subtree: true });
  }

    function onOrderSaved() {
    if (!isAdmin()) return;
    lastSelfSaveAt = Date.now();
    runPig();
    if (activeKey) setTimeout(poll, 1500);
  }

  /* ============================== ÂM THANH ============================== */
  let ac = null;
  const UNLOCK_EVENTS = ['pointerdown', 'touchend', 'keydown', 'click'];

  function getAC() {
    if (ac) return ac;
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    try { ac = new C(); } catch (e) { ac = null; }
    return ac;
  }

  // Trình duyệt chỉ cho phát tiếng sau khi người dùng chạm/bấm vào trang ít nhất 1 lần
  function unlock() {
    if (isMobile() && !CFG.mobileSound) return;     // điện thoại không dùng tiếng → khỏi tạo AudioContext
    const c = getAC();
    if (!c) return;
    const done = () => {
      if (c.state === 'running') UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, unlock, true));
    };
    if (c.state === 'suspended') c.resume().then(done).catch(() => {}); else done();
    try {
      const s = c.createBufferSource();
      s.buffer = c.createBuffer(1, 1, 22050);
      s.connect(c.destination);
      s.start(0);
    } catch (e) {}
  }
  UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, unlock, true));

  // ---- chung: bộ nén nhẹ để tiếng không bị vỡ, và 1 giây nhiễu trắng dùng làm "hơi thở" ----
  let master = null;
  function getMaster(c) {
    if (master && master.context === c) return master;
    const comp = c.createDynamicsCompressor();
    const g = c.createGain();
    g.gain.value = 0.85 * (CFG.volume || 1);
    comp.connect(g);
    g.connect(c.destination);
    master = comp;
    return master;
  }

  let noiseBuf = null;
  function getNoise(c) {
    if (noiseBuf && noiseBuf.sampleRate === c.sampleRate) return noiseBuf;
    noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return noiseBuf;
  }

  // Tiếng "ụt ịt / ủn ỉn": giọng thanh quản thô (sóng răng cưa + rung gằn ~30Hz)
  // đi qua 2 bộ lọc formant trượt từ "ủ" sang "ỉ", cộng thêm chút hơi thở mũi.
  function grunt(c, out, t, base, dur) {
    const osc = c.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(base * 0.8, t);
    osc.frequency.linearRampToValueAtTime(base * 1.12, t + dur * 0.4);
    osc.frequency.linearRampToValueAtTime(base * 0.7, t + dur);

    const amp = c.createGain();                 // rung gằn (growl)
    amp.gain.value = 0.62;
    const lfo = c.createOscillator();
    const lfoG = c.createGain();
    lfo.frequency.value = 30;
    lfoG.gain.value = 0.38;
    lfo.connect(lfoG);
    lfoG.connect(amp.gain);

    const f1 = c.createBiquadFilter();          // formant 1: 520 → 340 Hz
    const f2 = c.createBiquadFilter();          // formant 2: 950 → 2200 Hz
    f1.type = 'bandpass'; f1.Q.value = 5;
    f2.type = 'bandpass'; f2.Q.value = 6;
    f1.frequency.setValueAtTime(520, t);
    f1.frequency.linearRampToValueAtTime(340, t + dur);
    f2.frequency.setValueAtTime(950, t);
    f2.frequency.exponentialRampToValueAtTime(2200, t + dur * 0.85);
    const g1 = c.createGain(); g1.gain.value = 3.5;
    const g2 = c.createGain(); g2.gain.value = 2.2;

    const nz = c.createBufferSource();          // hơi thở mũi
    nz.buffer = getNoise(c);
    nz.loop = true;
    const nf = c.createBiquadFilter();
    nf.type = 'bandpass'; nf.frequency.value = 1800; nf.Q.value = 0.8;
    const ng = c.createGain(); ng.gain.value = 0.1;

    const env = c.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.9, t + 0.03);
    env.gain.setValueAtTime(0.9, t + dur - 0.09);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(amp);
    amp.connect(f1); f1.connect(g1); g1.connect(env);
    amp.connect(f2); f2.connect(g2); g2.connect(env);
    nz.connect(nf); nf.connect(ng); ng.connect(env);
    env.connect(out);

    osc.start(t); lfo.start(t); nz.start(t);
    osc.stop(t + dur + 0.05); lfo.stop(t + dur + 0.05); nz.stop(t + dur + 0.05);
  }

  // Tiếng "éc!": cao độ vọt lên rồi hạ, rung nhanh, lọc băng tần cao cho the thé
  function squeal(c, out, t, base) {
    const dur = 0.34;
    const osc = c.createOscillator();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(base * 0.7, t);
    osc.frequency.exponentialRampToValueAtTime(base * 1.55, t + 0.09);
    osc.frequency.linearRampToValueAtTime(base * 1.3, t + 0.2);
    osc.frequency.exponentialRampToValueAtTime(base * 0.6, t + dur);

    const vib = c.createOscillator();
    const vibG = c.createGain();
    vib.frequency.value = 55;
    vibG.gain.value = base * 0.07;
    vib.connect(vibG);
    vibG.connect(osc.frequency);

    const bp = c.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 2100; bp.Q.value = 2.5;
    const bp2 = c.createBiquadFilter();
    bp2.type = 'bandpass'; bp2.frequency.value = 3400; bp2.Q.value = 4;
    const g2 = c.createGain(); g2.gain.value = 0.5;
    const gain = c.createGain(); gain.gain.value = 3;

    const env = c.createGain();
    env.gain.setValueAtTime(0.0001, t);
    env.gain.exponentialRampToValueAtTime(0.8, t + 0.03);
    env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    osc.connect(bp); bp.connect(gain);
    osc.connect(bp2); bp2.connect(g2); g2.connect(gain);
    gain.connect(env);
    env.connect(out);

    osc.start(t); vib.start(t);
    osc.stop(t + dur + 0.05); vib.stop(t + dur + 0.05);
  }

  // kind = 'short': "ủn ỉn"   |   mặc định: "ủn ỉn… éc!"
  function playOink(kind) {
    if (muted) return;
    if (CFG.pigSoundUrl) {
      try { const a = new Audio(CFG.pigSoundUrl); a.volume = Math.min(1, CFG.volume || 1); a.play().catch(() => {}); } catch (e) {}
      return;
    }
    const c = getAC();
    if (!c) return;
    if (c.state === 'suspended') c.resume().catch(() => {});
    try {
      const out = getMaster(c);
      const t = c.currentTime + 0.03;
      grunt(c, out, t, 190, 0.30);
      grunt(c, out, t + 0.40, 240, 0.26);
      if (kind !== 'short') squeal(c, out, t + 0.80, 820);
    } catch (e) {}
  }

  /* =============================== HEO CHẠY =============================== */
  // Heo xuất phát góc dưới trái → chạy dọc đáy → lên mép phải → qua mép trên → xuống mép trái = 1 vòng màn hình.
  // Chân heo luôn hướng ra phía mép màn hình, đầu hướng theo chiều chạy; tới mỗi góc thì quay đầu.
  function pigDone() {
    pigRunning = false;
    if (pigQueued) { pigQueued = false; setTimeout(runPig, 300); }   // còn đơn mới đang chờ → chạy tiếp
  }

  // Bong bóng chữ: KHÔNG xoay theo heo (để chữ luôn thẳng), tự tính vị trí từ tư thế heo, ép nằm gọn trong màn hình
  function makeSay() {
    const d = document.createElement('div');
    d.className = 'adb-say';
    d.innerHTML =
      '<div class="adb-say-body">' + esc(CFG.pigText) + '</div>' +
      '<svg class="adb-say-tail" width="1" height="1"><path class="f" fill="#fff"/>' +
      '<path class="s" fill="none" stroke="#b5476f" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>';
    document.body.appendChild(d);
    return d;
  }
  function runPig() {
    if (isMobile()) return;                       // NẾU LÀ ĐIỆN THOẠI: Dừng ngay, không chạy heo (dù là admin)
    if (!isAdmin()) return;                       // không phải admin: không chạy heo, không kêu
    if (pigRunning) { pigQueued = true; return; }
    pigRunning = true;
    playOink();

    // Đã tắt hình / tab đang ẩn / trình duyệt quá cũ: chỉ kêu, không vẽ heo
    if (hidePig || document.hidden || typeof Element.prototype.animate !== 'function') {
      setTimeout(pigDone, 1400);
      return;
    }

    const W = window.innerWidth, H = window.innerHeight;
    const S = Math.round(Math.max(84, Math.min(120, W * 0.2)));   // kích thước khung heo
    const pad = 2;
    const x0 = pad, y0 = pad;
    const x1 = Math.max(x0 + 1, W - S - pad);
    const y1 = Math.max(y0 + 1, H - S - pad);
    const w = x1 - x0, h = y1 - y0, P = 2 * (w + h);

    const el = document.createElement('div');
    el.className = 'adb-pig';
    el.style.cssText = 'width:' + S + 'px;height:' + S + 'px';
    el.innerHTML = PIG_SVG;
    document.body.appendChild(el);

    // Mỗi góc dành 1 khoảng thời gian ngắn (tq) để xoay 90° rồi mới chạy tiếp
    const tq = 0.03;
    const mv = 1 - 3 * tq;
    const sw = (w / P) * mv, sh = (h / P) * mv;
    const k1 = sw, k2 = k1 + tq, k3 = k2 + sh, k4 = k3 + tq, k5 = k4 + sw, k6 = k5 + tq;
    // [thời điểm 0..1, x, y, góc xoay]
    const KF = [
      [0,  x0, y1, 0],      // đáy, chạy sang phải
      [k1, x1, y1, 0],
      [k2, x1, y1, -90],    // góc dưới phải → quay đầu lên
      [k3, x1, y0, -90],    // mép phải, chạy lên
      [k4, x1, y0, -180],   // góc trên phải → quay đầu sang trái
      [k5, x0, y0, -180],   // mép trên, chạy sang trái
      [k6, x0, y0, -270],   // góc trên trái → quay đầu xuống
      [1,  x0, y1, -270]    // mép trái, chạy xuống
    ];
    const poseAt = p => {
      for (let i = 1; i < KF.length; i++) {
        if (p <= KF[i][0]) {
          const a = KF[i - 1], b = KF[i];
          const r = b[0] === a[0] ? 1 : (p - a[0]) / (b[0] - a[0]);
          return { x: a[1] + (b[1] - a[1]) * r, y: a[2] + (b[2] - a[2]) * r, deg: a[3] + (b[3] - a[3]) * r };
        }
      }
      const l = KF[KF.length - 1];
      return { x: l[1], y: l[2], deg: l[3] };
    };

    const anim = el.animate(KF.map(k => ({
      transform: 'translate(' + k[1] + 'px,' + k[2] + 'px) rotate(' + k[3] + 'deg)', offset: k[0]
    })), { duration: CFG.pigMs, easing: 'linear', fill: 'forwards' });

    // ---- bong bóng "Có Toa Mới" ----
    const say = CFG.pigText ? makeSay() : null;
    let BW = 0, BH = 0, fPath = null, sPath = null;
    if (say) {
      BW = say.firstChild.offsetWidth;
      BH = say.firstChild.offsetHeight;
      fPath = say.querySelector('.f');
      sPath = say.querySelector('.s');
    }

    const updateSay = p => {
      const pose = poseAt(p);
      const th = pose.deg * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th);
      const R = (vx, vy) => [vx * cs - vy * sn, vx * sn + vy * cs];
      const hw = BW / 2, hh = BH / 2;

      // miệng heo (mõm) trên màn hình
      const m = R(S * 0.42, S * 0.12);
      const mx = pose.x + S / 2 + m[0], my = pose.y + S / 2 + m[1];

      // bong bóng nằm phía trước + phía trên (hướng vào trong màn hình) của miệng heo
      const f = R(1, 0), u = R(0, -1);
      const ef = hw * Math.abs(f[0]) + hh * Math.abs(f[1]);
      const eu = hw * Math.abs(u[0]) + hh * Math.abs(u[1]);
      let bx = mx + f[0] * (ef + 4) + u[0] * (eu + 9);
      let by = my + f[1] * (ef + 4) + u[1] * (eu + 9);

      const left = Math.max(6, Math.min(W - BW - 6, bx - hw));
      const top = Math.max(6, Math.min(H - BH - 6, by - hh));
      say.style.transform = 'translate(' + left + 'px,' + top + 'px)';
      say.style.opacity = '1';

      // đuôi bong bóng chỉ vào miệng heo
      const dx = mx - (left + hw), dy = my - (top + hh);
      if (Math.hypot(dx, dy) < 14) { fPath.setAttribute('d', ''); sPath.setAttribute('d', ''); return; }
      const tx = mx - left, ty = my - top;
      let b1, b2, inn;
      if (Math.abs(dx) * hh * 1.3 > Math.abs(dy) * hw) {      // đuôi mọc ra từ cạnh trái/phải
        const sx = dx > 0 ? 1 : -1, ex = sx > 0 ? BW : 0;
        b1 = [ex, hh - 4]; b2 = [ex, hh + 4]; inn = [-sx, 0];
      } else {                                                // đuôi mọc ra từ cạnh trên/dưới
        const sy = dy > 0 ? 1 : -1, ey = sy > 0 ? BH : 0;
        const c = Math.max(16, Math.min(BW - 16, hw + dx * (hh / Math.abs(dy))));
        b1 = [c - 5, ey]; b2 = [c + 5, ey]; inn = [0, -sy];
      }
      const e = 2.5;   // phần đuôi lấn vào trong để che đường viền bong bóng chỗ chân đuôi
      fPath.setAttribute('d',
        'M' + (b1[0] + inn[0] * e) + ' ' + (b1[1] + inn[1] * e) + 'L' + b1[0] + ' ' + b1[1] +
        'L' + tx + ' ' + ty + 'L' + b2[0] + ' ' + b2[1] +
        'L' + (b2[0] + inn[0] * e) + ' ' + (b2[1] + inn[1] * e) + 'Z');
      sPath.setAttribute('d', 'M' + b1[0] + ' ' + b1[1] + 'L' + tx + ' ' + ty + 'L' + b2[0] + ' ' + b2[1]);
    };

    let alive = true, raf = 0;
    const tick = () => {
      if (!alive) return;
      if (say) {
        const ct = anim.currentTime;
        updateSay(Math.min(1, Math.max(0, (ct == null ? 0 : Number(ct)) / CFG.pigMs)));
      }
      raf = requestAnimationFrame(tick);
    };
    tick();

    // Trong 1 vòng heo kêu 3 lần: lúc xuất phát, 1/3 vòng, và 2/3 vòng
    const timers = [
      setTimeout(() => playOink('short'), CFG.pigMs * 0.35),
      setTimeout(() => playOink(), CFG.pigMs * 0.7)
    ];
    const finish = () => {
      if (!alive) return;
      alive = false;
      cancelAnimationFrame(raf);
      timers.forEach(clearTimeout);
      el.remove();
      if (say) say.remove();
      pigDone();
    };
    anim.onfinish = finish;
    anim.oncancel = finish;
  }

  /* ================================ KHỞI ĐỘNG ================================ */
  function init() {
    document.addEventListener('click', e => {
      if (!activeKey || !e.target.closest) return;
      try {
        // Bấm nút "Làm mới" của app thì chuông cũng cập nhật theo
        if (e.target.closest(CFG.anchorSelector)) { setTimeout(poll, 400); return; }
        // Bấm nút "In": đợi server ghi nhận "đã in" rồi quét lại để đơn biến mất khỏi danh sách chờ in
        if (CFG.printSelector && e.target.closest(CFG.printSelector)) {
          setTimeout(poll, 2500);
          setTimeout(poll, 7000);
        }
      } catch (x) {}
    });
    // Đóng hộp thoại in của trình duyệt xong cũng quét lại
    window.addEventListener('afterprint', () => { if (activeKey) setTimeout(poll, 1500); });
    // Quay lại tab / có mạng lại: quét ngay, khỏi chờ chu kỳ kế tiếp
    document.addEventListener('visibilitychange', () => { if (!document.hidden && activeKey) poll(); });
    window.addEventListener('online', () => { if (activeKey) poll(); });
    setInterval(sync, 2000);
    sync();
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>
